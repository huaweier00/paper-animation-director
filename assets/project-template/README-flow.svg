<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">纸片动画导演逐镜生产流程</title>
  <desc id="desc">故事与来源、声音与时长、身份参考、镜头空间、最小资产、动画成片、三次审片和逐镜放行构成闭环；全部镜头完成后进入最终交付。</desc>
  <defs>
    <linearGradient id="paper" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f7f0de"/>
      <stop offset="1" stop-color="#e8d7b6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#4a3023" flood-opacity=".2"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#96633e"/>
    </marker>
  </defs>
  <rect width="1200" height="340" fill="#f4ead6"/>
  <path d="M0 300 C190 278 340 322 535 298 S905 318 1200 286" fill="none" stroke="#d0ad7b" stroke-width="2" opacity=".6"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Noto Sans SC','Microsoft YaHei',sans-serif" text-anchor="middle" filter="url(#shadow)">
    <g transform="translate(20 58)"><rect width="125" height="88" rx="12" fill="url(#paper)" stroke="#8b5d3b" stroke-width="2"/><text x="62.5" y="34" font-size="15" fill="#4c3024">故事与来源</text><text x="62.5" y="59" font-size="11" fill="#765441">结尾也先锁定</text></g>
    <g transform="translate(165 58)"><rect width="125" height="88" rx="12" fill="url(#paper)" stroke="#8b5d3b" stroke-width="2"/><text x="62.5" y="34" font-size="15" fill="#4c3024">声音与时长</text><text x="62.5" y="59" font-size="11" fill="#765441">台词进入账本</text></g>
    <g transform="translate(310 58)"><rect width="125" height="88" rx="12" fill="url(#paper)" stroke="#8b5d3b" stroke-width="2"/><text x="62.5" y="34" font-size="15" fill="#4c3024">身份参考</text><text x="62.5" y="59" font-size="11" fill="#765441">只参考不入镜</text></g>
    <g transform="translate(455 58)"><rect width="125" height="88" rx="12" fill="url(#paper)" stroke="#8b5d3b" stroke-width="2"/><text x="62.5" y="34" font-size="15" fill="#4c3024">镜头空间</text><text x="62.5" y="59" font-size="11" fill="#765441">方向目标可达</text></g>
    <g transform="translate(600 58)"><rect width="125" height="88" rx="12" fill="url(#paper)" stroke="#8b5d3b" stroke-width="2"/><text x="62.5" y="34" font-size="15" fill="#4c3024">最小资产</text><text x="62.5" y="59" font-size="11" fill="#765441">当前镜头专用</text></g>
    <g transform="translate(745 58)"><rect width="125" height="88" rx="12" fill="url(#paper)" stroke="#8b5d3b" stroke-width="2"/><text x="62.5" y="34" font-size="15" fill="#4c3024">动画与成片</text><text x="62.5" y="59" font-size="11" fill="#765441">确定性时间轴</text></g>
    <g transform="translate(890 58)"><rect width="125" height="88" rx="12" fill="url(#paper)" stroke="#8b5d3b" stroke-width="2"/><text x="62.5" y="34" font-size="15" fill="#4c3024">三次审片</text><text x="62.5" y="59" font-size="11" fill="#765441">静音／只听／合看</text></g>
    <g transform="translate(1035 58)"><rect width="125" height="88" rx="12" fill="url(#paper)" stroke="#8b5d3b" stroke-width="2"/><text x="62.5" y="34" font-size="15" fill="#4c3024">逐镜放行</text><text x="62.5" y="59" font-size="11" fill="#765441">失败就锁下一镜</text></g>
    <g transform="translate(965 242)"><rect width="215" height="66" rx="14" fill="#ead6ad" stroke="#8b5d3b" stroke-width="2"/><text x="107.5" y="27" font-size="15" fill="#4c3024">全片交付</text><text x="107.5" y="49" font-size="11" fill="#765441">母版／水印版／社交平台版</text></g>
  </g>
  <g fill="none" stroke="#96633e" stroke-width="3" marker-end="url(#arrow)">
    <path d="M147 102 H159"/><path d="M292 102 H304"/><path d="M437 102 H449"/><path d="M582 102 H594"/><path d="M727 102 H739"/><path d="M872 102 H884"/><path d="M1017 102 H1029"/>
    <path d="M1058 148 V196 H518 V152"/>
    <path d="M1098 148 V236"/>
  </g>
  <g font-family="-apple-system,BlinkMacSystemFont,'Noto Sans SC','Microsoft YaHei',sans-serif" fill="#5f3b2b">
    <text x="786" y="188" text-anchor="middle" font-size="14">通过且还有下一镜</text>
    <text x="1082" y="220" text-anchor="end" font-size="13">全部镜头通过</text>
    <text x="32" y="286" font-size="16">当前镜头未放行，不开始下一镜。</text>
  </g>
</svg>
