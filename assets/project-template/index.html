<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>__PROJECT_ID__</title>
    <script src="./node_modules/gsap/dist/gsap.min.js"></script>
    <style>
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #17130f; }
      body { display: grid; place-items: center; }
      #root { position: relative; width: __WIDTH__px; height: __HEIGHT__px; overflow: hidden; background: #e8dcc0; color: #f8f2df; font-family: "Noto Sans JP", sans-serif; }
      #canvas-fill { position: absolute; inset: 0; background: #e8dcc0; }
      .clip { position: absolute; inset: 0; }
      .scene-host { overflow: hidden; }
      #global-overlay { z-index: 40; pointer-events: none; }
      #paper-grain { position: absolute; inset: 0; opacity: .12; mix-blend-mode: multiply; background-image: radial-gradient(circle at 20% 30%, rgba(70,49,28,.24) 0 1px, transparent 1.4px), radial-gradient(circle at 70% 60%, rgba(255,250,232,.58) 0 1px, transparent 1.5px); background-size: 13px 13px, 17px 17px; }
      #caption-rail { position: absolute; left: 7%; right: 7%; bottom: 4.5%; height: 15%; display: grid; place-items: center; }
      .caption { position: absolute; max-width: 82%; padding: 13px 28px 16px; opacity: 0; color: #fbf4df; background: rgba(49,34,25,.82); border-bottom: 4px solid rgba(150,52,42,.88); box-shadow: 0 8px 18px rgba(31,20,14,.22); text-align: center; }
      .caption-zh { display: block; font-size: __CAPTION_SIZE__px; line-height: 1.2; font-weight: 650; }
      .caption-en { display: block; margin-top: 6px; color: rgba(252,246,232,.88); font-family: "EB Garamond", serif; font-size: __CAPTION_EN_SIZE__px; line-height: 1.16; }
    </style>
  </head>
  <body>
    <div id="root" data-hf-id="hf-root" data-composition-id="main" data-start="0" data-duration="__DURATION__" data-width="__WIDTH__" data-height="__HEIGHT__">
      <div id="canvas-fill" data-hf-id="hf-canvas-fill"></div>
__SCENE_HOSTS__
      <section id="global-overlay" data-hf-id="hf-global-overlay" class="clip" data-start="0" data-duration="__DURATION__" data-track-index="5">
        <div id="paper-grain" data-hf-id="hf-paper-grain" data-layout-ignore></div>
        <div id="caption-rail" data-hf-id="hf-caption-rail">
__CAPTIONS__
        </div>
      </section>
__AUDIO_TRACKS__
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
__TIMELINE_JS__
      window.__timelines.main = tl;
    </script>
  </body>
</html>
