<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>__PROJECT_ID__</title>
    <script src="./node_modules/gsap/dist/gsap.min.js"></script>
    <style>
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #161616; }
      body { display: grid; place-items: center; }
      #root { position: relative; width: __WIDTH__px; height: __HEIGHT__px; overflow: hidden; background: #808080; color: #fff; font-family: system-ui, sans-serif; }
      #canvas-fill {
        position: absolute;
        inset: 0;
        background-color: #777;
        background-image:
          linear-gradient(45deg, #858585 25%, transparent 25%),
          linear-gradient(-45deg, #858585 25%, transparent 25%),
          linear-gradient(45deg, transparent 75%, #858585 75%),
          linear-gradient(-45deg, transparent 75%, #858585 75%);
        background-position: 0 0, 0 16px, 16px -16px, -16px 0;
        background-size: 32px 32px;
      }
      .clip { position: absolute; inset: 0; }
      .scene-host { overflow: hidden; }
      #global-overlay { z-index: 40; pointer-events: none; }
      #caption-rail { position: absolute; left: 7%; right: 7%; bottom: 4.5%; height: 15%; display: grid; place-items: center; }
      .caption { position: absolute; max-width: 82%; padding: 10px 18px; opacity: 0; color: #fff; background: rgba(0,0,0,.78); outline: 2px dashed rgba(255,255,255,.5); text-align: center; }
      .caption::before { content: "DEVELOPMENT CAPTION — REDESIGN"; display: block; margin-bottom: 5px; color: #ffd84d; font-size: 12px; font-weight: 700; letter-spacing: .08em; }
      .caption-zh { display: block; font-size: __CAPTION_SIZE__px; line-height: 1.2; font-weight: 650; }
      .caption-en { display: block; margin-top: 6px; color: rgba(255,255,255,.82); font-size: __CAPTION_EN_SIZE__px; line-height: 1.16; }
    </style>
  </head>
  <body>
    <div id="root" data-hf-id="hf-root" data-composition-id="main" data-start="0" data-duration="__DURATION__" data-width="__WIDTH__" data-height="__HEIGHT__">
      <div id="canvas-fill" data-hf-id="hf-canvas-fill"></div>
__SCENE_HOSTS__
      <section id="global-overlay" data-hf-id="hf-global-overlay" class="clip" data-start="0" data-duration="__DURATION__" data-track-index="5">
        <div id="caption-rail" data-hf-id="hf-caption-rail">
__CAPTIONS__
        </div>
      </section>
__AUDIO_TRACKS__
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
__TIMELINE_JS__
      window.__timelines.main = tl;
    </script>
  </body>
</html>
